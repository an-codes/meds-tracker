<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dosage Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF8F1;
    --paper-dim:#FFFFFF;
    --ink:#5B4A42;
    --ink-soft:#B49A8F;
    --line:#F3DCE4;
    --given:#5FA875;
    --given-bg:#E3F6E7;
    --due:#FF8FA0;
    --due-bg:#FFE9EE;
    --accent:#FF6F91;
    --accent-2:#B79CED;
    --accent-3:#FFC96B;
    --lilac:#F3E8FF;
    --mint:#E4F7EE;
    --blush:#FFE8EF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 92% 4%, var(--blush) 0%, transparent 42%),
      radial-gradient(circle at 6% 14%, var(--lilac) 0%, transparent 38%),
      var(--paper);
    color:var(--ink);
    font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:22px 16px 90px;
  }
  header{
    position:relative;
    padding:20px 18px 22px;
    margin-bottom:22px;
    background:linear-gradient(135deg, var(--blush) 0%, var(--lilac) 100%);
    border-radius:24px;
    overflow:hidden;
  }
  header::before{
    content:"🐾";
    position:absolute;
    font-size:70px;
    opacity:0.12;
    right:-10px;
    top:-16px;
    transform:rotate(18deg);
  }
  header .kicker{
    font-size:12.5px;
    color:var(--accent);
    font-weight:700;
    margin-bottom:4px;
    position:relative;
  }
  header h1{
    font-family:"Baloo 2",sans-serif;
    font-size:30px;
    font-weight:700;
    margin:0;
    line-height:1.2;
    color:#7A4A5C;
    position:relative;
  }
  header .date{
    font-size:13.5px;
    color:var(--ink);
    opacity:0.7;
    margin-top:6px;
    position:relative;
    font-weight:600;
  }
  .cat-section{
    margin-bottom:24px;
  }
  .cat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    padding:0 4px;
  }
  .cat-name{
    font-family:"Baloo 2",sans-serif;
    font-size:21px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--ink);
  }
  .cat-emoji{
    font-size:22px;
  }
  .cat-sub{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:700;
  }
  .med-row{
    background:var(--paper-dim);
    border:2px solid var(--line);
    border-radius:18px;
    padding:13px 15px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    box-shadow:0 3px 0 rgba(255,143,160,0.08);
    transition:transform .12s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .med-row.given{
    border-color:var(--given);
    background:var(--given-bg);
  }
  .med-info{
    min-width:0;
  }
  .med-name{
    font-size:15.5px;
    font-weight:800;
    margin-bottom:2px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .med-time{
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:700;
  }
  .med-status{
    font-size:12px;
    margin-top:4px;
    font-weight:700;
  }
  .status-given{color:var(--given);}
  .status-due{color:var(--due);}
  .toggle-btn{
    flex-shrink:0;
    border:2px solid var(--line);
    background:var(--paper);
    border-radius:14px;
    padding:9px 14px;
    font-size:13.5px;
    font-weight:800;
    cursor:pointer;
    color:var(--ink);
    white-space:nowrap;
    font-family:"Nunito",sans-serif;
  }
  .toggle-btn:active{
    transform:scale(0.94);
  }
  .toggle-btn.is-given{
    background:var(--given);
    border-color:var(--given);
    color:#fff;
  }
  .toggle-btn.is-due{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.6;
    font-weight:700;
  }
  .empty .big-emoji{
    font-size:38px;
    display:block;
    margin-bottom:8px;
  }
  .add-link{
    display:inline-block;
    font-size:13.5px;
    color:var(--accent);
    cursor:pointer;
    padding:8px 4px;
    font-weight:800;
  }
  .panel{
    background:var(--mint);
    border:2px dashed var(--accent-2);
    border-radius:18px;
    padding:16px;
    margin-top:10px;
  }
  .panel h3{
    margin:0 0 12px;
    font-size:14.5px;
    font-weight:800;
    font-family:"Baloo 2",sans-serif;
    color:var(--ink);
  }
  .field{
    margin-bottom:10px;
  }
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;
    font-weight:700;
  }
  .field input{
    width:100%;
    padding:10px 12px;
    border:2px solid var(--line);
    border-radius:12px;
    font-size:14px;
    background:var(--paper-dim);
    color:var(--ink);
    font-family:"Nunito",sans-serif;
  }
  .field input:focus{
    outline:none;
    border-color:var(--accent);
  }
  .times-list{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .time-chip{
    background:var(--paper-dim);
    border:2px solid var(--accent-3);
    border-radius:20px;
    padding:5px 10px;
    font-size:12.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .time-chip button{
    border:none;
    background:none;
    color:var(--due);
    cursor:pointer;
    font-size:14px;
    line-height:1;
    padding:0;
    font-weight:800;
  }
  .row{
    display:flex;
    gap:8px;
  }
  .row input{flex:1;}
  .btn{
    border:none;
    border-radius:12px;
    padding:10px 14px;
    font-size:13.5px;
    font-weight:800;
    cursor:pointer;
    font-family:"Nunito",sans-serif;
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
  }
  .btn-secondary{
    background:var(--paper-dim);
    border:2px solid var(--line);
    color:var(--ink);
  }
  .panel-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .remove-cat{
    font-size:11.5px;
    color:var(--due);
    cursor:pointer;
    margin-left:8px;
    font-weight:700;
  }
  .loading{
    text-align:center;
    padding:60px 0;
    color:var(--ink-soft);
    font-size:14px;
    font-weight:700;
  }
  .footer-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:30px;
    line-height:1.7;
    font-weight:700;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">🐾 Fetching the dosage card…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
// ⬇️ Paste your Firebase config from the console here
const firebaseConfig = {
  apiKey: "AIzaSyDk4behbMzPyzGbWtzTBuvVtT3v7Ufj_mQ",
  authDomain: "meds-tracker-d7bb0.firebaseapp.com",
  databaseURL: "https://meds-tracker-d7bb0-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "meds-tracker-d7bb0",
  storageBucket: "meds-tracker-d7bb0.firebasestorage.app",
  messagingSenderId: "548528222024",
  appId: "1:548528222024:web:2deba49a3a1fdbf1030d7d"
};
firebase.initializeApp(firebaseConfig);

const db = firebase.database();
// Secret, unguessable path — keep this string private (don't post it publicly)
const STATE_REF = db.ref('gx2VDgRKcPj95vl89zpU5Ryh');

const STORAGE_KEY = 'cat-med-tracker-state';
const SHARED = true;

function effectiveDate(){
  // Treat the "day" as running 3AM–3AM instead of midnight–midnight,
  // so doses given late at night don't roll over until 3AM.
  const d = new Date();
  d.setHours(d.getHours() - 3);
  return d;
}
function todayStr(){
  const d = effectiveDate();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function niceDate(){
  return effectiveDate().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
}
function uid(){
  return Math.random().toString(36).slice(2,9);
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}

let state = { cats: [], meds: [], logs: {} };
let ui = { addingCatFor:false, addingMedFor:null, newTimeDraft:{} };

function defaultState(){
  const lunaId = uid();
  const marsId = uid();
  return {
    cats: [
      { id: lunaId, name: 'Luna' },
      { id: marsId, name: 'Mars' }
    ],
    meds: [
      { id: uid(), catId: lunaId, name: 'Paste', times: ['Morning','Evening'] },
      { id: uid(), catId: marsId, name: 'Gabapentin', times: ['Morning','Afternoon','Evening'] }
    ],
    logs: {}
  };
}

let saveTimer = null;

function loadState(){
  STATE_REF.on('value', (snapshot)=>{
    const val = snapshot.val();
    if(val){
      state = val;
      if(!state.cats) state.cats = [];
      if(!state.meds) state.meds = [];
      if(!state.logs) state.logs = {};
    } else {
      state = defaultState();
      saveState();
    }
    render();
  }, (err)=>{
    document.getElementById('app').innerHTML =
      '<div class="empty">😿 Couldn\'t connect to the database.<br>Check your Firebase config and rules.</div>';
    console.error(err);
  });
}

function saveState(){
  // debounce so rapid taps don't spam writes
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    STATE_REF.set(state).catch(e=>console.error('Save failed', e));
  }, 150);
}

function toggleDose(medId, timeLabel){
  const key = todayStr() + ':' + medId + ':' + timeLabel;
  const existing = state.logs[key];
  if(existing && existing.given){
    delete state.logs[key];
  } else {
    state.logs[key] = { given:true, at: new Date().toISOString() };
  }
  saveState();
  render();
}

function addCat(name){
  if(!name || !name.trim()) return;
  state.cats.push({ id: uid(), name: name.trim() });
  ui.addingCatFor = false;
  saveState();
  render();
}

function removeCat(catId){
  if(!confirm('Remove this cat and all their medications?')) return;
  state.cats = state.cats.filter(c=>c.id!==catId);
  state.meds = state.meds.filter(m=>m.catId!==catId);
  saveState();
  render();
}

function addMed(catId, name, times){
  if(!name || !name.trim() || !times.length) return;
  state.meds.push({ id: uid(), catId, name: name.trim(), times });
  ui.addingMedFor = null;
  ui.newTimeDraft = {};
  saveState();
  render();
}

function removeMed(medId){
  if(!confirm('Remove this medication?')) return;
  state.meds = state.meds.filter(m=>m.id!==medId);
  saveState();
  render();
}

function render(){
  const app = document.getElementById('app');
  const dateStr = todayStr();

  let html = `
    <header>
      <div class="kicker">✨ purr-scription tracker ✨</div>
      <h1>Who's had their medicine? 🐾</h1>
      <div class="date">${niceDate()}</div>
    </header>
  `;

  if(state.cats.length === 0){
    html += `
      <div class="empty"><span class="big-emoji">🐱</span>No kitties yet!<br>Add one to start tracking doses.</div>
      ${addCatPanel()}
    `;
    app.innerHTML = html;
    attachHandlers();
    return;
  }

  const catEmojis = ['🐈','🐈‍⬛','🐱','😽'];

  state.cats.forEach((cat, idx)=>{
    const meds = state.meds.filter(m=>m.catId===cat.id);
    const emoji = catEmojis[idx % catEmojis.length];
    html += `<div class="cat-section">
      <div class="cat-header">
        <span class="cat-name"><span class="cat-emoji">${emoji}</span>${escapeHtml(cat.name)}<span class="remove-cat" data-remove-cat="${cat.id}">remove</span></span>
        <span class="cat-sub">${meds.length} med${meds.length===1?'':'s'} 💊</span>
      </div>`;

    if(meds.length === 0){
      html += `<div class="empty" style="padding:18px 10px;">No medications for ${escapeHtml(cat.name)} yet. 🐾</div>`;
    }

    meds.forEach(med=>{
      med.times.forEach(timeLabel=>{
        const key = dateStr + ':' + med.id + ':' + timeLabel;
        const log = state.logs[key];
        const given = log && log.given;
        html += `
          <div class="med-row ${given?'given':''}">
            <div class="med-info">
              <div class="med-name">💊 ${escapeHtml(med.name)} <span class="remove-cat" data-remove-med="${med.id}">remove</span></div>
              <div class="med-time">${escapeHtml(timeLabel)}</div>
              <div class="med-status ${given?'status-given':'status-due'}">${given ? '✅ Given at ' + fmtTime(log.at) : '⏳ Not given yet'}</div>
            </div>
            <button class="toggle-btn ${given?'is-given':'is-due'}" data-toggle="${med.id}|${timeLabel}">
              ${given ? '↩️ Undo' : '🐾 Mark given'}
            </button>
          </div>
        `;
      });
    });

    if(ui.addingMedFor === cat.id){
      html += addMedPanel(cat.id);
    } else {
      html += `<span class="add-link" data-add-med="${cat.id}">🎀 Add medication</span>`;
    }

    html += `</div>`;
  });

  if(ui.addingCatFor){
    html += addCatPanel();
  } else {
    html += `<span class="add-link" data-add-cat="1">🐈 Add another cat</span>`;
  }

  app.innerHTML = html;
  attachHandlers();
}

function addCatPanel(){
  return `
    <div class="panel">
      <h3>🐾 Add a cat</h3>
      <div class="field">
        <label>Name</label>
        <input type="text" id="new-cat-name" placeholder="e.g. Whiskers">
      </div>
      <div class="panel-actions">
        <button class="btn btn-primary" id="save-cat-btn">🐱 Add cat</button>
        <button class="btn btn-secondary" id="cancel-cat-btn">Cancel</button>
      </div>
    </div>
  `;
}

function addMedPanel(catId){
  const draft = ui.newTimeDraft[catId] || { times: [] };
  ui.newTimeDraft[catId] = draft;
  return `
    <div class="panel">
      <h3>💊 Add medication</h3>
      <div class="field">
        <label>Medication name</label>
        <input type="text" id="new-med-name-${catId}" placeholder="e.g. Amoxicillin">
      </div>
      <div class="field">
        <label>Times per day</label>
        <div class="times-list">
          ${draft.times.map((t,i)=>`<span class="time-chip">${escapeHtml(t)}<button data-remove-time="${catId}|${i}">×</button></span>`).join('')}
        </div>
        <div class="row">
          <input type="text" id="new-time-${catId}" placeholder="e.g. Morning">
          <button class="btn btn-secondary" data-add-time="${catId}">Add</button>
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn btn-primary" data-save-med="${catId}">🎀 Save medication</button>
        <button class="btn btn-secondary" data-cancel-med="1">Cancel</button>
      </div>
    </div>
  `;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function attachHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const [medId, timeLabel] = el.getAttribute('data-toggle').split('|');
      toggleDose(medId, timeLabel);
    };
  });
  document.querySelectorAll('[data-remove-cat]').forEach(el=>{
    el.onclick = ()=> removeCat(el.getAttribute('data-remove-cat'));
  });
  document.querySelectorAll('[data-remove-med]').forEach(el=>{
    el.onclick = ()=> removeMed(el.getAttribute('data-remove-med'));
  });
  document.querySelectorAll('[data-add-med]').forEach(el=>{
    el.onclick = ()=>{ ui.addingMedFor = el.getAttribute('data-add-med'); render(); };
  });
  document.querySelectorAll('[data-cancel-med]').forEach(el=>{
    el.onclick = ()=>{ ui.addingMedFor = null; render(); };
  });
  document.querySelectorAll('[data-add-time]').forEach(el=>{
    el.onclick = ()=>{
      const catId = el.getAttribute('data-add-time');
      const input = document.getElementById('new-time-' + catId);
      const val = input.value.trim();
      if(!val) return;
      const draft = ui.newTimeDraft[catId] || { times: [] };
      draft.times.push(val);
      ui.newTimeDraft[catId] = draft;
      render();
    };
  });
  document.querySelectorAll('[data-remove-time]').forEach(el=>{
    el.onclick = ()=>{
      const [catId, idx] = el.getAttribute('data-remove-time').split('|');
      const draft = ui.newTimeDraft[catId];
      if(draft){ draft.times.splice(parseInt(idx,10),1); }
      render();
    };
  });
  document.querySelectorAll('[data-save-med]').forEach(el=>{
    el.onclick = ()=>{
      const catId = el.getAttribute('data-save-med');
      const name = document.getElementById('new-med-name-' + catId).value;
      const draft = ui.newTimeDraft[catId] || { times: [] };
      addMed(catId, name, draft.times);
    };
  });

  const addCatBtn = document.getElementById('save-cat-btn');
  if(addCatBtn){
    addCatBtn.onclick = ()=> addCat(document.getElementById('new-cat-name').value);
  }
  const cancelCatBtn = document.getElementById('cancel-cat-btn');
  if(cancelCatBtn){
    cancelCatBtn.onclick = ()=>{ ui.addingCatFor = false; render(); };
  }
  const addCatLink = document.querySelector('[data-add-cat]');
  if(addCatLink){
    addCatLink.onclick = ()=>{ ui.addingCatFor = true; render(); };
  }
}

loadState();
</script>
</body>
</html>
